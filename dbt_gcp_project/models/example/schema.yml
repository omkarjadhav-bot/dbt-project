version: 2

models:

  - name: dim_customers
    description: >
      Customer dimension containing customer profile information,
      order activity metrics, sales metrics, and customer sales ranking.

    columns:

      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: customer_name
        description: "Customer's full name."

      - name: city
        description: "Customer's city."

      - name: state
        description: "Customer's state."

      - name: customer_status
        description: "Current status of the customer."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'INACTIVE']

      - name: signup_date
        description: "Date when the customer signed up."

      - name: total_orders
        description: "Total number of orders placed by the customer."

      - name: completed_orders
        description: "Number of completed orders."

      - name: cancelled_orders
        description: "Number of cancelled orders."

      - name: returned_orders
        description: "Number of returned orders."

      - name: total_order_amount
        description: "Total monetary value of all orders."

      - name: completed_sales
        description: "Total monetary value of completed orders."

      - name: average_order_value
        description: "Average order value for the customer."

      - name: sales_rank
        description: "Customer ranking based on completed sales."


  - name: dim_products
    description: >
      Product dimension containing product attributes and
      aggregated sales metrics.

    columns:

      - name: product_id
        description: "Unique identifier for the product."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Name of the product."

      - name: category
        description: "High-level product category."

      - name: sub_category
        description: "Product sub-category."

      - name: brand
        description: "Product brand."

      - name: total_orders
        description: "Number of distinct orders containing the product."

      - name: total_quantity
        description: "Total quantity of the product sold."

      - name: total_sales
        description: "Total sales amount generated by the product."


  - name: fct_sales
    description: >
      Sales fact model containing order-level product transactions,
      customer information, product information, quantities,
      prices, discounts, and calculated sales amounts.

    columns:

      - name: order_id
        description: "Unique identifier of the order."
        data_tests:
          - not_null

      - name: order_date
        description: "Date on which the order was placed."

      - name: order_status
        description: "Current status of the order."

      - name: payment_method
        description: "Payment method used for the order."

      - name: customer_id
        description: "Identifier of the customer associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: customer_name
        description: "Name of the customer."

      - name: city
        description: "Customer's city."

      - name: state
        description: "Customer's state."

      - name: product_id
        description: "Identifier of the product."

      - name: product_name
        description: "Name of the product."

      - name: category
        description: "Product category."

      - name: sub_category
        description: "Product sub-category."

      - name: brand
        description: "Product brand."

      - name: quantity
        description: "Number of units purchased."

      - name: unit_price
        description: "Price of one unit before discount."

      - name: discount
        description: "Discount applied to the order line."

      - name: gross_amount
        description: "Gross amount before discount."

      - name: net_amount
        description: "Net sales amount after discount."